services:
  # PICC-PP-Kubernetes-Integration Service Application
  kubernetes-integration:
    build:
      context: .
      dockerfile: Dockerfile
    image: picc-pp-kubernetes-integration:latest
    container_name: kubernetes-integration-app
    restart: unless-stopped
    ports:
      - "${PORT:-8080}:8080"
    environment:
      PORT: ${PORT:-8080}
      SPRING_CLOUD_CONFIG_ENABLED: ${SPRING_CLOUD_CONFIG_ENABLED:-false}
      K8S_URL: ${K8S_URL:-https://kubernetes.default.svc}
      K8S_MASTER_TOKEN: ${K8S_MASTER_TOKEN:-}
      NNP_DASH_BASEURL: ${NNP_DASH_BASEURL:-http://localhost:8082}
      VAR_BASE_NNP_DOMAIN: ${VAR_BASE_NNP_DOMAIN:-localhost:8080}
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 25s
