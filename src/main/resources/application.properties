# ==============================================================================
# PICC-PP-Kubernetes-Integration - Core Application Configuration
# ==============================================================================
spring.application.name=PICC-PP-Kubernetes-Integration
server.port=${PORT:8080}

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# ------------------------------------------------------------------------------
# Spring Cloud Config (disabled by default for standalone open-source run)
# ------------------------------------------------------------------------------
spring.cloud.config.enabled=${SPRING_CLOUD_CONFIG_ENABLED:false}

# ------------------------------------------------------------------------------
# Kubernetes Cluster API Configuration
# ------------------------------------------------------------------------------
# Base API URL for target Kubernetes cluster (in-cluster default or external API)
k8s.url=${K8S_URL:https://kubernetes.default.svc}
# Cluster admin service account OAuth bearer token
k8s.master.token=${K8S_MASTER_TOKEN:}

# ------------------------------------------------------------------------------
# Nubo Native Platform (NNP) Dashboard & Domain Configuration
# ------------------------------------------------------------------------------
# Base URL of NNP Dashboard / Portal Backend service to fetch environment manifests
nnp.dash.baseurl=${NNP_DASH_BASEURL:http://localhost:8082}
# Public domain / gateway host used by interactive terminal UI
VAR.BASE.NNP.DOMAIN=${VAR_BASE_NNP_DOMAIN:localhost:8080}

# ------------------------------------------------------------------------------
# In-Memory Cache Configuration
# ------------------------------------------------------------------------------
spring.cache.type=simple
spring.cache.cache-names=nnp-environment

# ------------------------------------------------------------------------------
# Thymeleaf Template Engine Configuration (Terminal Web UI)
# ------------------------------------------------------------------------------
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# ------------------------------------------------------------------------------
# Swagger / OpenAPI 3.0 Documentation
# ------------------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# ------------------------------------------------------------------------------
# Actuator Observability & Health Probes
# ------------------------------------------------------------------------------
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always